<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلومات الـ IP والموقع</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 20px;
            text-align: center;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #232e3c);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            text-align: right;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>
    <h2>🌐 معلومات شبكتك</h2>

    <div class="card" id="info">
        <p>جاري جلب البيانات...</p>
    </div>

    <button class="btn" onclick="getLocation()">📍 تحديد الموقع الجغرافي (GPS)</button>
    <div id="gps-info"></div>

    <script>
        Telegram.WebApp.ready();

        // استخدام خدمة بديلة سريعة وثابتة لجلب الـ IP والموقع التقريبي
        fetch('https://ipwho.is/')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('info').innerHTML = `
                        <p><b>عنوان الـ IP:</b> ${data.ip}</p>
                        <p><b>الدولة:</b> ${data.country} (${data.country_code})</p>
                        <p><b>المدينة:</b> ${data.city}</p>
                        <p><b>مزود الخدمة:</b> ${data.connection.isp}</p>
                    `;
                } else {
                    document.getElementById('info').innerText = "فشل في جلب بيانات الشبكة.";
                }
            })
            .catch(() => {
                document.getElementById('info').innerText = "خطأ في الاتصال بالخدمة.";
            });

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    document.getElementById('gps-info').innerHTML = `
                        <div class="card">
                            <p><b>خط العرض:</b> ${lat}</p>
                            <p><b>خط الطول:</b> ${lon}</p>
                            <br>
                            <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" style="color: #4ac1f7; text-decoration: none;">فتح في خرائط Google 🗺️</a>
                        </div>
                    `;
                }, () => {
                    alert("يرجى السماح للبوت بالوصول إلى موقعك من إعدادات الهاتف.");
                }, { enableHighAccuracy: true });
            } else {
                alert("متصفحك لا يدعم تحديد الموقع.");
            }
        }
    </script>
</body>


</html>
