<div class="card" id="info">
    <p>جاري تحميل بيانات الـ IP...</p>
</div>

<button class="btn" onclick="getLocation()">📍 تحديد الموقع الدقيق (GPS)</button>
<div id="gps-info"></div>

<script>
    // تهيئة مكتبة تليغرام
    Telegram.WebApp.ready();

    // جلب الـ IP والموقع التقريبي عبر الـ Network
    fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
            document.getElementById('info').innerHTML = `
                <p><b>عنوان الـ IP:</b> ${data.ip}</p>
                <p><b>الدولة:</b> ￼{data.country_code})</p>
                <p><b>المدينة:</b> ${data.city}</p>
                <p><b>مزود الخدمة (ISP):</b> ${data.org}</p>
            `;
        })
        .catch(() => {
            document.getElementById('info').innerText = "تعذر جلب بيانات الـ IP";
        });

    // جلب الموقع الدقيق باستخدام GPS
    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                document.getElementById('gps-info').innerHTML = `
                    <div class="card">
                        <p><b>خط العرض:</b> ${lat}</p>
                        <p><b>خط الطول:</b> ${lon}</p>
                        <a href="https://www.google.com/maps?q=￼{lon}" target="_blank">فتح في خرائط Google 🗺️</a>
                    </div>
                `;
            }, () => {
                alert("تم رفض إذن الوصول للموقع.");
            });
        } else {
            alert("متصفحك لا يدعم تحديد الموقع.");
        }
    }
</script>
